<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEMAN · Gestão de Viaturas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#10141A; --bg-elev:#161C24; --surface:#1D2530; --surface-2:#252E3B;
    --border:#303A47; --text:#E7ECF2; --text-dim:#93A0B0; --text-faint:#5C6879;
    --amber:#E8A93A;
    --verde:#3DDC84; --azul:#00abfb; --vermelho:#EF5350; --roxo:#B18CFF;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .wrap{max-width:1400px;margin:0 auto;padding:20px 18px 60px;}

  /* ============ HEADER ============ */
  header{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;
    padding:20px 22px;background:linear-gradient(135deg,var(--bg-elev),var(--surface));
    border:1px solid var(--border);border-radius:14px;margin-bottom:18px;position:relative;overflow:hidden;}
  header::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--amber);}
  .htitle{display:flex;flex-direction:column;gap:2px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;}
  h1{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:26px;margin:0;}

  .update-indicator{font-size:11px;color:var(--text-faint);text-align:right;margin-bottom:14px;}

  /* ============ CARDS DE RESUMO ============ */
  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
  .summary-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;}
  .summary-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;}
  .summary-card.total::before{background:var(--amber);}
  .summary-card.ativas::before{background:var(--azul);}
  .summary-card.reservas::before{background:var(--roxo);}
  .summary-card.baixadas::before{background:var(--vermelho);}
  .summary-card .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-family:'IBM Plex Mono',monospace;}
  .summary-card .value{font-family:'Rajdhani',sans-serif;font-size:34px;font-weight:700;line-height:1;}
  .summary-card.total .value{color:var(--amber);}
  .summary-card.ativas .value{color:var(--azul);}
  .summary-card.reservas .value{color:var(--roxo);}
  .summary-card.baixadas .value{color:var(--vermelho);}

  /* ============ TOOLBAR ============ */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .tabs{display:flex;gap:6px;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:4px;overflow-x:auto;}
  .tab{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;padding:8px 16px;border-radius:7px;cursor:pointer;color:var(--text-dim);border:none;background:transparent;white-space:nowrap;}
  .tab.active{background:var(--surface-2);color:var(--text);box-shadow:inset 0 0 0 1px var(--border);}
  .right-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  input[type=text]{background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:8px 10px;font-size:13px;min-width:0;font-family:'Inter',sans-serif;}
  input:focus{outline:1px solid var(--amber);}
  .btn{font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;padding:9px 14px;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);white-space:nowrap;}
  .btn:hover{border-color:var(--amber);}
  .btn.primary{background:var(--amber);color:#1a1204;border-color:var(--amber);}
  .btn.ghost{background:transparent;}
  .btn.danger:hover{border-color:var(--vermelho);color:var(--vermelho);}

  /* ============ CARDS POR LOCAL ============ */
  .local-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;}
  .local-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
  .local-card.reserva{border-color:rgba(177,140,255,.4);}
  .local-card.baixadas{border-color:rgba(239,83,80,.4);}

  .local-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);gap:10px;}
  .local-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;color:var(--amber);letter-spacing:.02em;}
  .local-card.reserva .local-name{color:var(--roxo);}
  .local-card.baixadas .local-name{color:var(--vermelho);}
  .local-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:2px 10px;white-space:nowrap;}

  .local-body{padding:6px 10px;flex:1;}

  /* Linha de viatura dentro do card */
  .veh-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 6px;border-bottom:1px solid rgba(48,58,71,.4);}
  .veh-row:last-child{border-bottom:none;}
  .veh-row-left{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1;}
  .veh-row-prefix{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:17px;color:var(--text);}
  .veh-row-info{font-size:10px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;overflow-wrap:break-word;}
  .veh-row-actions{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;flex-shrink:0;}
  .veh-row-actions .btn{font-size:11px;padding:5px 9px;border-radius:6px;}

  .local-empty{font-size:12px;color:var(--text-faint);padding:20px;text-align:center;font-style:italic;}

  /* ============ MODAL ============ */
  .modal-overlay{position:fixed;inset:0;background:rgba(16,20,26,.85);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px 24px;width:100%;max-width:500px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:90vh;overflow-y:auto;}
  .modal-box h2{font-family:'Rajdhani',sans-serif;font-size:20px;margin:0;color:var(--amber);}
  .modal-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .modal-grid label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;}
  .modal-grid input, .modal-grid select{width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:9px 11px;font-size:13px;font-family:'Inter',sans-serif;}
  .modal-grid input:focus, .modal-grid select:focus{outline:1px solid var(--amber);}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;}

  .empty{text-align:center;color:var(--text-faint);padding:40px 20px;font-size:14px;grid-column:1/-1;}
  footer{text-align:center;color:var(--text-faint);font-size:11px;margin-top:40px;}
</style>
</head>
<body>

<div id="actionModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h2 id="modalTitle">Ação</h2>
    <div class="modal-grid" id="modalFields"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">Cancelar</button>
      <button class="btn primary" id="modalConfirm">Confirmar</button>
    </div>
  </div>
</div>

<div class="wrap">

  <header>
    <div class="htitle">
      <div class="eyebrow">DEMAN · Gestão de Viaturas</div>
      <h1>Painel de Viaturas por Local</h1>
    </div>
  </header>

  <div class="update-indicator" id="updateStatus">Carregando dados...</div>

  <div class="summary" id="summaryCards"></div>

  <div class="toolbar">
    <div class="tabs" id="tabsContainer"></div>
    <div class="right-tools">
      <input type="text" id="search" placeholder="Buscar prefixo ou local">
      <button class="btn" id="addBtn">+ Nova Viatura</button>
    </div>
  </div>

  <div class="local-grid" id="localGrid"></div>

  <footer>Dados carregados da planilha Google Sheets.</footer>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzTBLYK1DGYKjndJZYt2mm03aLiuwyamzc4s2dDsYY_YJpj3fh0CaptQGG1hMReJhqG/exec';
const USUARIO_ATUAL = 'Operador';

let VIATURAS = [];
let LOCAIS = [];
let activeTab = 'todas';

function normalizeStr(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

// ==============================================
// API
// ==============================================
async function apiCall(action, payload){
  const controller = new AbortController();
  const timeoutId = setTimeout(() => controller.abort(), 45000);

  try{
    console.log('📤 Enviando:', action, payload || {});
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(Object.assign({ action, usuario: USUARIO_ATUAL }, payload || {})),
      signal: controller.signal
    });
    clearTimeout(timeoutId);

    console.log('📥 Status HTTP:', r.status);
    const txt = await r.text();
    console.log('📥 Resposta:', txt.substring(0, 200));

    if(!r.ok) return { ok:false, error:'HTTP ' + r.status + ' — ' + txt.substring(0, 100) };

    try{
      return JSON.parse(txt);
    }catch(e){
      return { ok:false, error:'Resposta não é JSON: ' + txt.substring(0, 100) };
    }
  }catch(err){
    clearTimeout(timeoutId);
    console.error('❌ Erro fetch:', err);
    if(err.name === 'AbortError'){
      return { ok:false, error:'Tempo esgotado (45s). Tente novamente.' };
    }
    return { ok:false, error:'Erro de rede: ' + err.message };
  }
}

// ==============================================
// CARREGAMENTO
// ==============================================
async function loadData(){
  try{
    const r = await apiCall('listarViaturas');
    if(!r.ok){
      document.getElementById('updateStatus').textContent = 'Falha: ' + (r.error || 'desconhecido');
      VIATURAS = [];
      render();
      return;
    }
    VIATURAS = Array.isArray(r.viaturas) ? r.viaturas : [];
    LOCAIS = Array.isArray(r.locais) ? r.locais : [];
    document.getElementById('updateStatus').textContent = 'Atualizado em ' + new Date().toLocaleTimeString('pt-BR');
    render();
  }catch(err){
    console.error('Erro em loadData:', err);
    document.getElementById('updateStatus').textContent = 'Erro: ' + err.message;
    VIATURAS = [];
    render();
  }
}

// ==============================================
// RESUMO
// ==============================================
function renderSummary(){
  try{
    const total = VIATURAS.length;
    const ativas = VIATURAS.filter(v => v.origem === 'ativa').length;
    const reservas = VIATURAS.filter(v => v.origem === 'reserva').length;
    const baixadas = VIATURAS.filter(v => v.origem === 'baixada').length;

    document.getElementById('summaryCards').innerHTML = `
      <div class="summary-card total">
        <div class="label">Total geral</div>
        <div class="value">${total}</div>
      </div>
      <div class="summary-card ativas">
        <div class="label">Ativas</div>
        <div class="value">${ativas}</div>
      </div>
      <div class="summary-card reservas">
        <div class="label">Reservas (DEMAN)</div>
        <div class="value">${reservas}</div>
      </div>
      <div class="summary-card baixadas">
        <div class="label">Baixadas</div>
        <div class="value">${baixadas}</div>
      </div>`;
  }catch(e){ console.error('renderSummary:', e); }
}

// ==============================================
// ABAS
// ==============================================
function renderTabs(){
  try{
    const container = document.getElementById('tabsContainer');
    let html = `<button class="tab ${activeTab==='todas'?'active':''}" data-tab="todas">Todas</button>`;
    html += `<button class="tab ${activeTab==='baixadas'?'active':''}" data-tab="baixadas">Baixadas</button>`;
    container.innerHTML = html;
    container.querySelectorAll('.tab').forEach(t => {
      t.addEventListener('click', () => { activeTab = t.dataset.tab; render(); });
    });
  }catch(e){ console.error('renderTabs:', e); }
}

// ==============================================
// LINHA DE VIATURA (dentro de um card de local)
// ==============================================
function htmlVehRow(v){
  if(v.origem === 'baixada'){
    return `
      <div class="veh-row">
        <div class="veh-row-left">
          <span class="veh-row-prefix">${escapeHtml(v.prefixo)}</span>
          ${v.motivo ? `<span class="veh-row-info">Motivo: ${escapeHtml(v.motivo)}</span>` : ''}
          ${v.data ? `<span class="veh-row-info">${escapeHtml(v.data)}</span>` : ''}
        </div>
        <div class="veh-row-actions">
          <button class="btn ghost" data-action="reativar" data-prefixo="${escapeAttr(v.prefixo)}">Reativar</button>
          <button class="btn ghost" data-action="moverReserva" data-prefixo="${escapeAttr(v.prefixo)}">→ Reserva</button>
        </div>
      </div>`;
  }

  if(v.origem === 'reserva'){
    return `
      <div class="veh-row">
        <div class="veh-row-left">
          <span class="veh-row-prefix">${escapeHtml(v.prefixo)}</span>
        </div>
        <div class="veh-row-actions">
          <button class="btn ghost" data-action="permutar" data-prefixo="${escapeAttr(v.prefixo)}" data-origem="reserva" data-gbm="">→ Ativa</button>
          <button class="btn ghost danger" data-action="baixar" data-prefixo="${escapeAttr(v.prefixo)}" data-gbm="" data-origem="reserva">Baixar</button>
        </div>
      </div>`;
  }

  // Ativa
  return `
    <div class="veh-row">
      <div class="veh-row-left">
        <span class="veh-row-prefix">${escapeHtml(v.prefixo)}</span>
      </div>
      <div class="veh-row-actions">
        <button class="btn ghost" data-action="mudar" data-prefixo="${escapeAttr(v.prefixo)}">Mudar</button>
        <button class="btn ghost" data-action="permutar" data-prefixo="${escapeAttr(v.prefixo)}" data-origem="ativa" data-gbm="${escapeAttr(v.gbm||'')}">→ Res</button>
        <button class="btn ghost danger" data-action="baixar" data-prefixo="${escapeAttr(v.prefixo)}" data-gbm="${escapeAttr(v.gbm||'')}" data-origem="ativa">Baixar</button>
      </div>
    </div>`;
}

// ==============================================
// CARD DE LOCAL
// ==============================================
function htmlLocalCard(nome, viaturas, tipo){
  const qtd = viaturas.length;
  const label = qtd === 1 ? '1 viatura' : qtd + ' viaturas';
  const bodyHtml = qtd === 0
    ? `<div class="local-empty">Nenhuma viatura neste local</div>`
    : viaturas.sort((a,b)=>a.prefixo.localeCompare(b.prefixo)).map(htmlVehRow).join('');

  return `
    <div class="local-card ${tipo || ''}">
      <div class="local-head">
        <div class="local-name">${escapeHtml(nome)}</div>
        <div class="local-count">${label}</div>
      </div>
      <div class="local-body">${bodyHtml}</div>
    </div>`;
}

// ==============================================
// GRID PRINCIPAL — agrupado por LOCAL
// ==============================================
function renderLocalGrid(){
  try{
    const q = normalizeStr(document.getElementById('search').value);
    const container = document.getElementById('localGrid');

    // Modo "Baixadas"
    if(activeTab === 'baixadas'){
      let baixadas = VIATURAS.filter(v => v.origem === 'baixada');
      if(q) baixadas = baixadas.filter(v => normalizeStr(v.prefixo).includes(q) || normalizeStr(v.motivo).includes(q));

      if(baixadas.length === 0){
        container.innerHTML = '<div class="empty">Nenhuma viatura baixada.</div>';
        return;
      }
      container.innerHTML = htmlLocalCard('BAIXADAS', baixadas, 'baixadas');
      bindActions();
      return;
    }

    // Modo "Todas" — agrupa ativas por local + DEMAN (reservas)
    const ativas = VIATURAS.filter(v => v.origem === 'ativa');
    const reservas = VIATURAS.filter(v => v.origem === 'reserva');

    // Filtro de busca
    const matchesQ = v => !q || normalizeStr(v.prefixo).includes(q) || normalizeStr(v.gbm).includes(q);

    // Monta agrupamento por local (respeitando a ordem da whitelist)
    const porLocal = {};
    LOCAIS.forEach(l => porLocal[l] = []);
    ativas.filter(matchesQ).forEach(v => {
      const key = v.gbm || '(Sem local)';
      if(!porLocal[key]) porLocal[key] = [];
      porLocal[key].push(v);
    });

    // Ordem: whitelist primeiro, depois "Sem local" se houver
    const ordem = [...LOCAIS];
    if(porLocal['(Sem local)']) ordem.push('(Sem local)');

    let html = '';

    // Cards por local (ativos)
    ordem.forEach(local => {
      const lista = porLocal[local] || [];
      // Se está buscando, esconde os cards vazios
      if(q && lista.length === 0) return;
      // Fora de busca, mostra todos os locais (mesmo vazios) para dar visão geral
      html += htmlLocalCard(local, lista, '');
    });

    // Card DEMAN (reservas)
    const reservasFiltradas = reservas.filter(matchesQ);
    if(!q || reservasFiltradas.length > 0){
      html += htmlLocalCard('DEMAN (Reservas)', reservasFiltradas, 'reserva');
    }

    if(html.trim() === ''){
      container.innerHTML = '<div class="empty">Nenhuma viatura encontrada.</div>';
      return;
    }

    container.innerHTML = html;
    bindActions();
  }catch(e){ console.error('renderLocalGrid:', e); }
}

// ==============================================
// BIND DOS BOTÕES DE AÇÃO
// ==============================================
function bindActions(){
  document.querySelectorAll('[data-action="mudar"]').forEach(btn => {
    btn.addEventListener('click', () => abrirModalMudarLocal(btn.dataset.prefixo));
  });
  document.querySelectorAll('[data-action="permutar"]').forEach(btn => {
    btn.addEventListener('click', () => abrirModalPermutar(btn.dataset.prefixo, btn.dataset.origem, btn.dataset.gbm));
  });
  document.querySelectorAll('[data-action="baixar"]').forEach(btn => {
    btn.addEventListener('click', () => abrirModalBaixar(btn.dataset.prefixo, btn.dataset.gbm, btn.dataset.origem));
  });
  document.querySelectorAll('[data-action="reativar"]').forEach(btn => {
    btn.addEventListener('click', () => abrirModalReativar(btn.dataset.prefixo));
  });
  document.querySelectorAll('[data-action="moverReserva"]').forEach(btn => {
    btn.addEventListener('click', () => abrirModalMoverReserva(btn.dataset.prefixo));
  });
}

function render(){
  renderSummary();
  renderTabs();
  renderLocalGrid();
}

document.getElementById('search').addEventListener('input', render);

// ==============================================
// MODAL GENÉRICO
// ==============================================
function abrirModal(titulo, camposHtml, onConfirm){
  document.getElementById('modalTitle').textContent = titulo;
  document.getElementById('modalFields').innerHTML = camposHtml;
  const modal = document.getElementById('actionModal');
  modal.style.display = 'flex';

  const confirm = document.getElementById('modalConfirm');
  const cancel = document.getElementById('modalCancel');

  function fechar(){
    modal.style.display = 'none';
    confirm.removeEventListener('click', handler);
    cancel.removeEventListener('click', fechar);
    confirm.disabled = false;
    confirm.textContent = 'Confirmar';
  }
  async function handler(){
    if(confirm.disabled) return;
    confirm.disabled = true;
    confirm.textContent = 'Processando...';

    try{
      const ok = await onConfirm();
      if(ok) fechar();
      else { confirm.disabled = false; confirm.textContent = 'Confirmar'; }
    }catch(e){
      alert('Erro: ' + e.message);
      confirm.disabled = false;
      confirm.textContent = 'Confirmar';
    }
  }
  confirm.addEventListener('click', handler);
  cancel.addEventListener('click', fechar);
}

function htmlOpcoesLocais(selecionado){
  let html = '';
  LOCAIS.forEach(l => {
    const sel = (selecionado && normalizeStr(l) === normalizeStr(selecionado)) ? ' selected' : '';
    html += `<option value="${escapeAttr(l)}"${sel}>${escapeHtml(l)}</option>`;
  });
  return html;
}

function htmlOpcoesSubstituta(prefixoExcluido){
  const outras = VIATURAS.filter(v => v.prefixo !== prefixoExcluido && v.origem !== 'baixada');
  if(outras.length === 0) return `<option value="">— Nenhuma outra viatura disponível —</option>`;
  let html = `<option value="">— Nenhuma (deixar vaga) —</option>`;
  const reservas = outras.filter(v => v.origem === 'reserva');
  const ativas = outras.filter(v => v.origem === 'ativa');
  if(reservas.length){
    html += `<optgroup label="Reservas (serão promovidas)">`;
    reservas.forEach(v => html += `<option value="${escapeAttr(v.prefixo)}">${escapeHtml(v.prefixo)} · DEMAN</option>`);
    html += `</optgroup>`;
  }
  if(ativas.length){
    html += `<optgroup label="Ativas (serão realocadas)">`;
    ativas.forEach(v => html += `<option value="${escapeAttr(v.prefixo)}">${escapeHtml(v.prefixo)} · ${escapeHtml(v.gbm)}</option>`);
    html += `</optgroup>`;
  }
  return html;
}

// ==============================================
// AÇÕES
// ==============================================
function abrirModalMudarLocal(prefixo){
  const v = VIATURAS.find(x => x.prefixo === prefixo);
  if(!v) return;
  abrirModal('Mudar local · ' + prefixo, `
    <label>Local atual
      <input type="text" value="${escapeAttr(v.gbm)}" disabled style="opacity:.6;">
    </label>
    <label>Novo local
      <select id="modalGbm" autofocus>${htmlOpcoesLocais(v.gbm)}</select>
    </label>
  `, async () => {
    const novoGbm = document.getElementById('modalGbm').value;
    if(!novoGbm){ alert('Selecione o local.'); return false; }
    if(normalizeStr(novoGbm) === normalizeStr(v.gbm)){
      alert('O local é o mesmo. Nada a alterar.');
      return false;
    }
    const r = await apiCall('mudarGbm', { prefixo, novoGbm });
    if(!r.ok){ alert('Erro: ' + r.error); return false; }
    await loadData();
    return true;
  });
}

function abrirModalPermutar(prefixo, origem, gbm){
  const destinoAPI = origem === 'ativa' ? 'reservas' : 'ativas';
  const destinoLabel = origem === 'ativa' ? 'DEMAN (Reserva)' : 'Ativa';
  const titulo = origem === 'ativa' ? `Mover ${prefixo} para Reserva` : `Mover ${prefixo} para Ativa`;

  let corpo = `<p style="font-size:13px;color:var(--text-dim);margin:0;">
    <b>${escapeHtml(prefixo)}</b> ${gbm ? `· ${escapeHtml(gbm)}` : ''} será movida para <b>${destinoLabel}</b>.
  </p>`;

  if(origem === 'ativa' && gbm){
    corpo += `<label>Viatura substituta em ${escapeHtml(gbm)} (opcional)
      <select id="modalSubstituto">${htmlOpcoesSubstituta(prefixo)}</select>
    </label>`;
  }

  abrirModal(titulo, corpo, async () => {
    const sub = document.getElementById('modalSubstituto');
    const substituto = sub ? sub.value : '';
    const r = await apiCall('permutarViatura', { prefixo, destino: destinoAPI, substituto });
    if(!r.ok){ alert('Erro: ' + r.error); return false; }
    await loadData();
    return true;
  });
}

function abrirModalBaixar(prefixo, gbm, origem){
  let corpo = `<p style="font-size:13px;color:var(--text-dim);margin:0;">
    Confirma o baixamento de <b>${escapeHtml(prefixo)}</b>${gbm ? ` (${escapeHtml(gbm)})` : ''}?
  </p>
  <label>Motivo
    <input type="text" id="modalMotivo" placeholder="Ex: manutenção preventiva" autofocus>
  </label>`;

  if(origem === 'ativa' && gbm){
    corpo += `<label>Viatura substituta em ${escapeHtml(gbm)} (opcional)
      <select id="modalSubstituto">${htmlOpcoesSubstituta(prefixo)}</select>
    </label>`;
  }

  abrirModal('Baixar viatura · ' + prefixo, corpo, async () => {
    const motivo = document.getElementById('modalMotivo').value.trim();
    if(!motivo){ alert('Informe o motivo.'); return false; }
    const sub = document.getElementById('modalSubstituto');
    const substituto = sub ? sub.value : '';
    const r = await apiCall('baixarViatura', { prefixo, motivo, substituto });
    if(!r.ok){ alert('Erro: ' + r.error); return false; }
    await loadData();
    return true;
  });
}

function abrirModalReativar(prefixo){
  const v = VIATURAS.find(x => x.prefixo === prefixo);
  if(!v) return;

  abrirModal('Reativar viatura · ' + prefixo, `
    <p style="font-size:13px;color:var(--text-dim);margin:0;">
      <b>${escapeHtml(prefixo)}</b> voltará ao serviço ativo.
    </p>
    ${v.gbm ? `<label>Local original
      <input type="text" value="${escapeAttr(v.gbm)}" disabled style="opacity:.6;">
    </label>` : ''}
    <label>Novo local (pode ser qualquer um)
      <select id="modalGbm" autofocus>${htmlOpcoesLocais(v.gbm)}</select>
    </label>
  `, async () => {
    const gbm = document.getElementById('modalGbm').value;
    if(!gbm){ alert('Selecione o local.'); return false; }
    const r = await apiCall('reativarViatura', { prefixo, gbm });
    if(!r.ok){ alert('Erro: ' + r.error); return false; }
    await loadData();
    return true;
  });
}

function abrirModalMoverReserva(prefixo){
  abrirModal('Mover para Reserva · ' + prefixo, `
    <p style="font-size:13px;color:var(--text-dim);margin:0;">
      <b>${escapeHtml(prefixo)}</b> será movida de <b>baixadas</b> para <b>DEMAN (Reserva)</b>.
    </p>
  `, async () => {
    const r = await apiCall('moverBaixadaParaReserva', { prefixo });
    if(!r.ok){ alert('Erro: ' + r.error); return false; }

    return true;
  });
}

document.getElementById('addBtn').addEventListener('click', () => {
  abrirModal('Nova Viatura', `
    <label>Prefixo
      <input type="text" id="newPrefixo" placeholder="Ex: ABT-05" autofocus>
    </label>
    <label>Local
      <select id="newGbm">${htmlOpcoesLocais('')}</select>
    </label>
  `, async () => {
    const prefixo = document.getElementById('newPrefixo').value.trim();
    const gbm = document.getElementById('newGbm').value;
    if(!prefixo){ alert('Informe o prefixo.'); return false; }
    if(!gbm){ alert('Selecione o local.'); return false; }
    const r = await apiCall('adicionarViatura', { prefixo, gbm });
    if(!r.ok){ alert('Erro: ' + r.error); return false; }
    await loadData();
    return true;
  });
});
