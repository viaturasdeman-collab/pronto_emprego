<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>DEMAN · Gestão de Viaturas</title>

<!-- ✅ iOS meta tags -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="format-detection" content="telephone=no">
<meta name="color-scheme" content="dark">

<!-- ✅ DNS prefetch + preconnect para acelerar Apps Script -->
<link rel="dns-prefetch" href="https://script.google.com">
<link rel="dns-prefetch" href="https://script.googleusercontent.com">
<link rel="preconnect" href="https://script.google.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<!-- ✅ Fonts com display=swap (não bloqueiam render no iOS) -->
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" as="style" onload="this.rel='stylesheet'">
<noscript>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</noscript>

<style>
  :root{
    --bg:#10141A; --bg-elev:#161C24; --surface:#1D2530; --surface-2:#252E3B;
    --border:#303A47; --text:#E7ECF2; --text-dim:#93A0B0; --text-faint:#5C6879;
    --amber:#E8A93A;
    --verde:#3DDC84; --azul:#00abfb; --vermelho:#EF5350; --roxo:#B18CFF;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:var(--bg);color:var(--text);
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    -webkit-font-smoothing:antialiased;
    -webkit-text-size-adjust:100%;
    /* ✅ iOS: evita "rubber band" na rolagem horizontal */
    overscroll-behavior-y: contain;
  }
  .wrap{
    max-width:1400px;margin:0 auto;
    padding:20px 18px calc(60px + env(safe-area-inset-bottom)) 18px;
    padding-left: calc(18px + env(safe-area-inset-left));
    padding-right: calc(18px + env(safe-area-inset-right));
  }

  header{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:space-between;
    padding:20px 22px;background:linear-gradient(135deg,var(--bg-elev),var(--surface));
    border:1px solid var(--border);border-radius:14px;margin-bottom:18px;position:relative;overflow:hidden;}
  header::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--amber);}
  .htitle{display:flex;flex-direction:column;gap:2px;}
  .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;color:var(--amber);text-transform:uppercase;}
  h1{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:26px;margin:0;}
  .user-area{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--text-dim);}
  .user-area .who{font-family:'IBM Plex Mono',monospace;}
  .user-area .who b{color:var(--amber);}
  .user-area .badge-perfil{
    font-family:'IBM Plex Mono',monospace;font-size:10px;padding:2px 8px;border-radius:12px;
    border:1px solid var(--border);white-space:nowrap;
  }
  .user-area .badge-perfil.admin{background:rgba(232,169,58,.15);color:var(--amber);border-color:var(--amber);}
  .user-area .badge-perfil.visualizar{background:rgba(147,160,176,.15);color:var(--text-dim);border-color:var(--border);}

  .login-overlay{position:fixed;inset:0;background:rgba(16,20,26,.97);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px;}
  .login-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:26px 24px;width:340px;max-width:100%;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .login-box h2{font-family:'Rajdhani',sans-serif;font-size:22px;margin:0 0 4px;}
  .login-box p.sub{font-size:12px;color:var(--text-dim);margin:0 0 8px;}
  .login-box input{
    background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:8px;padding:10px 12px;font-family:'Inter',sans-serif;font-size:16px;
    -webkit-appearance:none;  /* ✅ iOS: remove o estilo padrão feio de input */
  }
  .login-box input:focus{outline:1px solid var(--amber);}
  .login-box .btn{width:100%;justify-content:center;padding:11px;font-size:15px;}
  .login-error{color:var(--vermelho);font-size:12px;text-align:center;display:none;}
  .login-footer{font-size:10.5px;color:var(--text-faint);text-align:center;margin-top:6px;}

  .update-indicator{font-size:11px;color:var(--text-faint);text-align:right;margin-bottom:14px;}

  .summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:20px;}
  .summary-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:16px 18px;position:relative;overflow:hidden;
    cursor:pointer;transition:border-color .15s, background .15s, transform .12s;user-select:none;
    -webkit-tap-highlight-color:transparent;  /* ✅ iOS: remove flash azul do tap */}
  .summary-card:hover{border-color:var(--amber);}
  .summary-card:active{transform:scale(0.98);}
  .summary-card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;}
  .summary-card.total::before{background:var(--amber);}
  .summary-card.ativas::before{background:var(--azul);}
  .summary-card.reservas::before{background:var(--roxo);}
  .summary-card.baixadas::before{background:var(--vermelho);}
  .summary-card.departamental::before{background:var(--verde);}
  .summary-card .label{font-size:11px;color:var(--text-dim);text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px;font-family:'IBM Plex Mono',monospace;}
  .summary-card .value{font-family:'Rajdhani',sans-serif;font-size:34px;font-weight:700;line-height:1;}
  .summary-card.total .value{color:var(--amber);}
  .summary-card.ativas .value{color:var(--azul);}
  .summary-card.reservas .value{color:var(--roxo);}
  .summary-card.baixadas .value{color:var(--vermelho);}
  .summary-card.departamental .value{color:var(--verde);}

  .summary-card.active-filter{border-color:var(--amber);background:linear-gradient(135deg, rgba(232,169,58,.12), transparent);}
  .summary-card.active-filter .label{color:var(--amber);}
  .summary-card.active-filter::after{content:'✓';position:absolute;top:8px;right:10px;color:var(--amber);font-size:14px;font-weight:700;}
  .summary-card.ativas.active-filter{border-color:var(--azul);background:linear-gradient(135deg, rgba(0,171,251,.12), transparent);}
  .summary-card.ativas.active-filter .label{color:var(--azul);}
  .summary-card.ativas.active-filter::after{color:var(--azul);}
  .summary-card.reservas.active-filter{border-color:var(--roxo);background:linear-gradient(135deg, rgba(177,140,255,.12), transparent);}
  .summary-card.reservas.active-filter .label{color:var(--roxo);}
  .summary-card.reservas.active-filter::after{color:var(--roxo);}
  .summary-card.baixadas.active-filter{border-color:var(--vermelho);background:linear-gradient(135deg, rgba(239,83,80,.12), transparent);}
  .summary-card.baixadas.active-filter .label{color:var(--vermelho);}
  .summary-card.baixadas.active-filter::after{color:var(--vermelho);}
  .summary-card.departamental.active-filter{border-color:var(--verde);background:linear-gradient(135deg, rgba(61,220,132,.12), transparent);}
  .summary-card.departamental.active-filter .label{color:var(--verde);}
  .summary-card.departamental.active-filter::after{color:var(--verde);}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:flex-end;margin-bottom:16px;}
  .right-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
  input[type=text]{
    background:var(--surface);border:1px solid var(--border);color:var(--text);border-radius:8px;
    padding:8px 10px;font-size:16px;min-width:0;font-family:'Inter',sans-serif;
    -webkit-appearance:none;  /* ✅ iOS: sem borda interna feia */
  }
  input:focus{outline:1px solid var(--amber);}
  .btn{
    font-family:'Rajdhani',sans-serif;font-weight:600;font-size:14px;padding:9px 14px;border-radius:8px;
    cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);white-space:nowrap;
    -webkit-tap-highlight-color:transparent;  /* ✅ iOS: sem flash azul */
    -webkit-appearance:none;  /* ✅ iOS: remove estilo nativo de botão */
  }
  .btn:hover{border-color:var(--amber);}
  .btn.primary{background:var(--amber);color:#1a1204;border-color:var(--amber);}
  .btn.ghost{background:transparent;}
  .btn.danger:hover{border-color:var(--vermelho);color:var(--vermelho);}

  .local-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:14px;}
  .local-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;}
  .local-card.reserva{border-color:rgba(177,140,255,.4);}
  .local-card.baixadas{border-color:rgba(239,83,80,.4);}

  .local-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:var(--surface-2);border-bottom:1px solid var(--border);gap:10px;}
  .local-name{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:16px;color:var(--amber);letter-spacing:.02em;}
  .local-card.reserva .local-name{color:var(--roxo);}
  .local-card.baixadas .local-name{color:var(--vermelho);}
  .local-count{font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--text-dim);background:var(--bg);border:1px solid var(--border);border-radius:20px;padding:2px 10px;white-space:nowrap;}

  .local-body{padding:6px 12px;flex:1;}

  .veh-row{display:flex;flex-direction:column;gap:8px;padding:12px 4px;border-bottom:1px solid rgba(48,58,71,.4);}
  .veh-row:last-child{border-bottom:none;}

  .veh-row-top{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .veh-row-prefix{font-family:'Rajdhani',sans-serif;font-weight:700;font-size:18px;color:var(--text);}
  .veh-row-info{font-size:10px;color:var(--text-faint);font-family:'IBM Plex Mono',monospace;text-align:right;}

  .veh-row-actions{display:flex;gap:6px;flex-wrap:wrap;}
  .veh-row-actions .btn{font-size:12px;padding:7px 12px;border-radius:6px;flex:1;min-width:0;text-align:center;}

  .local-empty{font-size:12px;color:var(--text-faint);padding:20px;text-align:center;font-style:italic;}

  .modal-overlay{position:fixed;inset:0;background:rgba(16,20,26,.85);display:flex;align-items:center;justify-content:center;z-index:10000;padding:20px;
    padding-bottom: calc(20px + env(safe-area-inset-bottom));}
  .modal-box{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:22px 24px;width:100%;max-width:500px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.6);max-height:90vh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;  /* ✅ iOS: rolagem suave dentro do modal */}
  .modal-box h2{font-family:'Rajdhani',sans-serif;font-size:20px;margin:0;color:var(--amber);}
  .modal-grid{display:grid;grid-template-columns:1fr;gap:10px;}
  .modal-grid label{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--text-dim);font-family:'IBM Plex Mono',monospace;text-transform:uppercase;}
  .modal-grid input, .modal-grid select{
    width:100%;background:var(--surface-2);border:1px solid var(--border);color:var(--text);
    border-radius:7px;padding:9px 11px;font-size:16px;font-family:'Inter',sans-serif;
    -webkit-appearance:none;  /* ✅ iOS: remove estilo nativo */
  }
  .modal-grid input:focus, .modal-grid select:focus{outline:1px solid var(--amber);}
  .modal-actions{display:flex;gap:8px;justify-content:flex-end;}

  .empty{text-align:center;color:var(--text-faint);padding:40px 20px;font-size:14px;grid-column:1/-1;}
  footer{text-align:center;color:var(--text-faint);font-size:11px;margin-top:40px;}

  /* ============ SKELETON / LOADING ============ */
  .skel{
    background:linear-gradient(90deg, rgba(255,255,255,0.02) 0%, rgba(255,255,255,0.06) 50%, rgba(255,255,255,0.02) 100%);
    background-size:200% 100%;
    animation:shimmer 1.2s linear infinite;
    border-radius:8px;
  }
  @keyframes shimmer{ from { background-position: 200% 0 } to { background-position: -200% 0 } }

  /* ✅ iOS: reduz animações se o usuário preferir */
  @media (prefers-reduced-motion: reduce){
    *, *::before, *::after{
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }

  /* ✅ Ajuste fino para telas pequenas (iOS SE / iPhone mini) */
  @media (max-width: 560px){
    h1{ font-size: 20px; }
    .local-grid{ grid-template-columns: 1fr; }
    .summary{ grid-template-columns: repeat(2, 1fr); }
    .summary-card .value{ font-size: 26px; }
  }
</style>
</head>
<body>

<div id="loginOverlay" class="login-overlay" style="display:none;">
  <div class="login-box">
    <h2>DEMAN · Acesso</h2>
    <p class="sub">Entre com suas credenciais para continuar.</p>
    <input type="text" id="loginUser" placeholder="Usuário" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false">
    <input type="password" id="loginPass" placeholder="Senha" autocomplete="current-password">
    <p id="loginError" class="login-error">Usuário ou senha inválidos.</p>
    <button class="btn primary" id="loginBtn">Entrar</button>
    <div class="login-footer">Uso interno · Registro de auditoria ativo</div>
  </div>
</div>

<div id="actionModal" class="modal-overlay" style="display:none;">
  <div class="modal-box">
    <h2 id="modalTitle">Ação</h2>
    <div class="modal-grid" id="modalFields"></div>
    <div class="modal-actions">
      <button class="btn ghost" id="modalCancel">Cancelar</button>
      <button class="btn primary" id="modalConfirm">Confirmar</button>
    </div>
  </div>
</div>

<div class="wrap">

  <header>
    <div class="htitle">
      <div class="eyebrow">DEMAN · Gestão de Viaturas</div>
      <h1>Painel de Viaturas por Local</h1>
    </div>
    <div class="user-area">
      <span class="who">Logado como <b id="currentUserName">—</b></span>
      <span class="badge-perfil" id="currentUserPerfil" style="display:none;"></span>
      <button class="btn ghost" id="logoutBtn">Sair</button>
    </div>
  </header>

  <div class="update-indicator" id="updateStatus">Carregando dados...</div>

  <div class="summary" id="summaryCards"></div>

  <div class="toolbar">
    <div class="right-tools">
      <input type="text" id="search" placeholder="Buscar prefixo ou local" autocapitalize="characters" autocorrect="off" spellcheck="false">
      <button class="btn ghost" id="clearFilterBtn" style="display:none;">Limpar filtro</button>
    </div>
  </div>

  <div class="local-grid" id="localGrid"></div>

  <footer>Dados carregados da planilha Google Sheets.</footer>
</div>

<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzTBLYK1DGYKjndJZYt2mm03aLiuwyamzc4s2dDsYY_YJpj3fh0CaptQGG1hMReJhqG/exec';

const USERS = {
  'deman':    { senha: 'deman2026',  nome: 'DEMAN',    perfil: 'admin'      },
  'visitante': { senha: 'frota2026',  nome: 'VISITANTE', perfil: 'visualizar' }
};

const MOTIVOS_BAIXA = ['Sinistro', 'Manutenção'];

const CACHE_KEY = 'deman_cache_viaturas_v1';
const CACHE_META_KEY = 'deman_cache_viaturas_meta';

let VIATURAS = [];
let LOCAIS = [];
let LOCAIS_DEPARTAMENTAIS = [];
let activeFilter = 'todas';

let USUARIO_ATUAL = '';
let PERFIL_ATUAL = 'visualizar';

function isAdmin(){ return PERFIL_ATUAL === 'admin'; }

function normalizeStr(s){ return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim(); }
function escapeHtml(s){ const d=document.createElement('div'); d.textContent=s; return d.innerHTML; }
function escapeAttr(s){ return escapeHtml(s).replace(/"/g,'&quot;'); }

function ehLocalDepartamental(local){
  if(!local) return false;
  const l = normalizeStr(local);
  return LOCAIS_DEPARTAMENTAIS.some(d => normalizeStr(d) === l);
}

function todosOsLocais(){
  return [...LOCAIS, ...LOCAIS_DEPARTAMENTAIS];
}

// ==============================================
// AUTENTICAÇÃO
// ==============================================
function showLogin(){ document.getElementById('loginOverlay').style.display = 'flex'; document.getElementById('loginUser').focus(); }
function hideLogin(){ document.getElementById('loginOverlay').style.display = 'none'; }

function handleLogin(){
  const u = document.getElementById('loginUser').value.trim().toLowerCase();
  const p = document.getElementById('loginPass').value;
  const err = document.getElementById('loginError');
  const acc = USERS[u];
  if(acc && acc.senha === p){
    sessionStorage.setItem('deman_auth', 'ok');
    sessionStorage.setItem('deman_user_nome', acc.nome);
    sessionStorage.setItem('deman_user_perfil', acc.perfil);
    USUARIO_ATUAL = acc.nome;
    PERFIL_ATUAL = acc.perfil;
    err.style.display = 'none';
    startApp();
  } else {
    err.style.display = 'block';
  }
}

function handleLogout(){
  sessionStorage.removeItem('deman_auth');
  sessionStorage.removeItem('deman_user_nome');
  sessionStorage.removeItem('deman_user_perfil');
  // ✅ Limpa o cache de viaturas ao sair
  try{ sessionStorage.removeItem(CACHE_KEY); sessionStorage.removeItem(CACHE_META_KEY); }catch(e){}
  location.reload();
}

document.getElementById('loginBtn').addEventListener('click', handleLogin);
document.getElementById('loginPass').addEventListener('keydown', e => { if(e.key === 'Enter') handleLogin(); });
document.getElementById('loginUser').addEventListener('keydown', e => { if(e.key === 'Enter') document.getElementById('loginPass').focus(); });
document.getElementById('logoutBtn').addEventListener('click', handleLogout);

// ==============================================
// API — com timeout reduzido para iOS (25s)
// ==============================================
async function apiCall(action, payload){
  const controller = new AbortController();
  // ✅ Timeout reduzido (iOS Safari corta em ~30s)
  const timeoutId = setTimeout(() => controller.abort(), 25000);
  try{
    console.log('📤 Enviando:', action, payload || {});
    const r = await fetch(APPS_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify(Object.assign({ action, usuario: USUARIO_ATUAL }, payload || {})),
      signal: controller.signal,
      // ✅ iOS: força revalidação para evitar cache agressivo
      cache: 'no-store'
    });
    clearTimeout(timeoutId);
    console.log('📥 Status HTTP:', r.status);
    const txt = await r.text();
    console.log('📥 Resposta:', txt.substring(0, 200));
    if(!r.ok) return { ok:false, error:'HTTP ' + r.status + ' — ' + txt.substring(0, 100) };
    try{ return JSON.parse(txt); }
    catch(e){ return { ok:false, error:'Resposta não é JSON: ' + txt.substring(0, 100) }; }
  }catch(err){
    clearTimeout(timeoutId);
    console.error('❌ Erro fetch:', err);
    if(err.name === 'AbortError'){
      return { ok:false, error:'A rede está lenta. Tente novamente em alguns segundos.' };
    }
    return { ok:false, error:'Erro de rede: ' + err.message };
  }
}

// ==============================================
// CACHE LOCAL — melhora muito a UX no iOS
// ==============================================
function salvarCache(){
  try{
    sessionStorage.setItem(CACHE_KEY, JSON.stringify({
      viaturas: VIATURAS,
      locais: LOCAIS,
      locaisDepartamentais: LOCAIS_DEPARTAMENTAIS
    }));
    sessionStorage.setItem(CACHE_META_KEY, String(Date.now()));
  }catch(e){ console.warn('Não foi possível salvar cache:', e); }
}

function carregarCache(){
  try{
    const raw = sessionStorage.getItem(CACHE_KEY);
    if(!raw) return false;
    const dados = JSON.parse(raw);
    if(!dados || !Array.isArray(dados.viaturas)) return false;
    VIATURAS = dados.viaturas;
    LOCAIS = Array.isArray(dados.locais) ? dados.locais : [];
    LOCAIS_DEPARTAMENTAIS = Array.isArray(dados.locaisDepartamentais) ? dados.locaisDepartamentais : [];
    return true;
  }catch(e){ return false; }
}

function idadeCache(){
  try{
    const t = parseInt(sessionStorage.getItem(CACHE_META_KEY) || '0', 10);
    if(!t) return Infinity;
    return Math.floor((Date.now() - t) / 1000); // segundos
  }catch(e){ return Infinity; }
}

// ==============================================
// CARREGAMENTO
// ==============================================
async function loadData(){
  try{
    document.getElementById('updateStatus').textContent = 'Atualizando...';
    const r = await apiCall('listarViaturas');
    if(!r.ok){
      document.getElementById('updateStatus').textContent = 'Falha: ' + (r.error || 'desconhecido');
      if(VIATURAS.length === 0){ render(); }
      return;
    }
    VIATURAS = Array.isArray(r.viaturas) ? r.viaturas : [];
    LOCAIS = Array.isArray(r.locais) ? r.locais : [];
    LOCAIS_DEPARTAMENTAIS = Array.isArray(r.locaisDepartamentais) ? r.locaisDepartamentais : [];
    salvarCache();
    document.getElementById('updateStatus').textContent = 'Atualizado em ' + new Date().toLocaleTimeString('pt-BR');
    render();
  }catch(err){
    console.error('Erro em loadData:', err);
    document.getElementById('updateStatus').textContent = 'Erro: ' + err.message;
    if(VIATURAS.length === 0){ render(); }
  }
}

// ==============================================
// RESUMO
// ==============================================
function renderSummary(){
  try{
    const total = VIATURAS.length;
    const naoBaixadas = VIATURAS.filter(v => v.origem !== 'baixada').length;
    const reservas = VIATURAS.filter(v => v.origem === 'reserva').length;
    const baixadas = VIATURAS.filter(v => v.origem === 'baixada').length;
    const departamental = VIATURAS.filter(v => v.origem === 'ativa' && ehLocalDepartamental(v.gbm)).length;

    const cards = [
      { key: 'todas',         label: 'Total geral',       value: total,         cls: 'total' },
      { key: 'ativas',        label: 'Ativas',            value: naoBaixadas,   cls: 'ativas' },
      { key: 'reservas',      label: 'Reservas (DEMAN)',  value: reservas,      cls: 'reservas' },
      { key: 'baixadas',      label: 'Baixadas',          value: baixadas,      cls: 'baixadas' },
      { key: 'departamental', label: 'Departamental',     value: departamental, cls: 'departamental' }
    ];

    document.getElementById('summaryCards').innerHTML = cards.map(c => {
      const active = activeFilter === c.key;
      return `
        <div class="summary-card ${c.cls} ${active ? 'active-filter' : ''}" data-filter="${c.key}">
          <div class="label">${c.label}</div>
          <div class="value">${c.value}</div>
        </div>`;
    }).join('');

    document.querySelectorAll('.summary-card').forEach(card => {
      card.addEventListener('click', () => {
        const key = card.dataset.filter;
        activeFilter = (activeFilter === key) ? 'todas' : key;
        render();
      });
    });

    const clearBtn = document.getElementById('clearFilterBtn');
    if(clearBtn) clearBtn.style.display = (activeFilter === 'todas') ? 'none' : 'inline-block';
  }catch(e){ console.error('renderSummary:', e); }
}

document.getElementById('clearFilterBtn').addEventListener('click', () => {
  activeFilter = 'todas';
  render();
});

// ==============================================
// LINHA DE VIATURA
// ==============================================
function htmlVehRow(v){
  const admin = isAdmin();

  if(v.origem === 'baixada'){
    return `
      <div class="veh-row">
        <div class="veh-row-top">
          <span class="veh-row-prefix">${escapeHtml(v.prefixo)}</span>
          ${v.gbm ? `<span class="veh-row-info">Era ${escapeHtml(v.gbm)}</span>` : ''}
        </div>
        ${v.motivo ? `<div class="veh-row-info" style="text-align:left;">Motivo: ${escapeHtml(v.motivo)}</div>` : ''}
        ${v.data ? `<div class="veh-row-info" style="text-align:left;">${escapeHtml(v.data)}</div>` : ''}
        ${admin ? `
        <div class="veh-row-actions">
          <button class="btn ghost" data-action="reativar" data-prefixo="${escapeAttr(v.prefixo)}">Reativar</button>
          <button class="btn ghost" data-action="moverReserva" data-prefixo="${escapeAttr(v.prefixo)}">→ Reserva</button>
        </div>` : ''}
      </div>`;
  }

  if(v.origem === 'reserva'){
    return `
      <div class="veh-row">
        <div class="veh-row-top">
          <span class="veh-row-prefix">${escapeHtml(v.prefixo)}</span>
        </div>
        ${admin ? `
        <div class="veh-row-actions">
          <button class="btn ghost" data-action="permutar" data-prefixo="${escapeAttr(v.prefixo)}" data-origem="reserva" data-gbm="">→ Ativa</button>
          <button class="btn ghost danger" data-action="baixar" data-prefixo="${escapeAttr(v.prefixo)}" data-gbm="" data-origem="reserva">Baixar</button>
        </div>` : ''}
      </div>`;
  }

  return `
    <div class="veh-row">
      <div class="veh-row-top">
        <span class="veh-row-prefix">${escapeHtml(v.prefixo)}</span>
      </div>
      ${admin ? `
      <div class="veh-row-actions">
        <button class="btn ghost" data-action="mudar" data-prefixo="${escapeAttr(v.prefixo)}">Mudar local</button>
        <button class="btn ghost" data-action="permutar" data-prefixo="${escapeAttr(v.prefixo)}" data-origem="ativa" data-gbm="${escapeAttr(v.gbm||'')}">→ Reserva</button>
        <button class="btn ghost danger" data-action="baixar" data-prefixo="${escapeAttr(v.prefixo)}" data-gbm="${escapeAttr(v.gbm||'')}" data-origem="ativa">Baixar</button>
      </div>` : ''}
    </div>`;
}

// ==============================================
// CARD DE LOCAL
// ==============================================
function htmlLocalCard(nome, viaturas, tipo){
  const qtd = viaturas.length;
  const label = qtd === 1 ? '1 viatura' : qtd + ' viaturas';
  const bodyHtml = qtd === 0
    ? `<div class="local-empty">Nenhuma viatura neste local</div>`
    : viaturas.sort((a,b)=>a.prefixo.localeCompare(b.prefixo)).map(htmlVehRow).join('');

  return `
    <div class="local-card ${tipo || ''}">
      <div class="local-head">
        <div class="local-name">${escapeHtml(nome)}</div>
        <div class="local-count">${label}</div>
      </div>
      <div class="local-body">${bodyHtml}</div>
    </div>`;
}

// ==============================================
// GRID PRINCIPAL
// ==============================================
function renderLocalGrid(){
  try{
    const q = normalizeStr(document.getElementById('search').value);
    const container = document.getElementById('localGrid');
    const matchesQ = v => !q || normalizeStr(v.prefixo).includes(q) || normalizeStr(v.gbm).includes(q);

    if(activeFilter === 'baixadas'){
      let baixadas = VIATURAS.filter(v => v.origem === 'baixada').filter(matchesQ);
      if(baixadas.length === 0){
        container.innerHTML = '<div class="empty">Nenhuma viatura baixada.</div>';
        return;
      }
      container.innerHTML = htmlLocalCard('BAIXADAS', baixadas, 'baixadas');
      bindActions();
      return;
    }

    if(activeFilter === 'reservas'){
      let reservas = VIATURAS.filter(v => v.origem === 'reserva').filter(matchesQ);
      if(reservas.length === 0){
        container.innerHTML = '<div class="empty">Nenhuma viatura em reserva (DEMAN).</div>';
        return;
      }
      container.innerHTML = htmlLocalCard('DEMAN (Reservas)', reservas, 'reserva');
      bindActions();
      return;
    }

    if(activeFilter === 'departamental'){
      const ativasDep = VIATURAS.filter(v => v.origem === 'ativa' && ehLocalDepartamental(v.gbm) && matchesQ(v));
      if(ativasDep.length === 0){
        container.innerHTML = '<div class="empty">Nenhuma viatura em locais departamentais.</div>';
        return;
      }
      const porLocal = {};
      LOCAIS_DEPARTAMENTAIS.forEach(l => porLocal[l] = []);
      ativasDep.forEach(v => {
        const key = v.gbm || '(Sem local)';
        if(!porLocal[key]) porLocal[key] = [];
        porLocal[key].push(v);
      });
      let html = '';
      LOCAIS_DEPARTAMENTAIS.forEach(local => {
        const lista = porLocal[local] || [];
        if(q && lista.length === 0) return;
        html += htmlLocalCard(local, lista, '');
      });
      container.innerHTML = html;
      bindActions();
      return;
    }

    if(activeFilter === 'ativas'){
      const naoBaixadas = VIATURAS.filter(v => v.origem !== 'baixada').filter(matchesQ);
      if(naoBaixadas.length === 0){
        container.innerHTML = '<div class="empty">Nenhuma viatura ativa.</div>';
        return;
      }
      const ativas = naoBaixadas.filter(v => v.origem === 'ativa');
      const reservas = naoBaixadas.filter(v => v.origem === 'reserva');

      const porLocal = {};
      todosOsLocais().forEach(l => porLocal[l] = []);
      ativas.forEach(v => {
        const key = v.gbm || '(Sem local)';
        if(!porLocal[key]) porLocal[key] = [];
        porLocal[key].push(v);
      });
      const ordem = [...todosOsLocais()];
      if(porLocal['(Sem local)']) ordem.push('(Sem local)');
      let html = '';
      ordem.forEach(local => {
        const lista = porLocal[local] || [];
        if(q && lista.length === 0) return;
        html += htmlLocalCard(local, lista, '');
      });
      if(reservas.length > 0){
        html += htmlLocalCard('DEMAN (Reservas)', reservas, 'reserva');
      }
      container.innerHTML = html;
      bindActions();
      return;
    }

    // TODAS (padrão)
    const ativas = VIATURAS.filter(v => v.origem === 'ativa');
    const porLocal = {};
    todosOsLocais().forEach(l => porLocal[l] = []);
    ativas.filter(matchesQ).forEach(v => {
      const key = v.gbm || '(Sem local)';
      if(!porLocal[key]) porLocal[key] = [];
      porLocal[key].push(v);
    });
    const ordem = [...todosOsLocais()];
    if(porLocal['(Sem local)']) ordem.push('(Sem local)');
    let html = '';
    ordem.forEach(local => {
      const lista = porLocal[local] || [];
      if(q && lista.length === 0) return;
      html += htmlLocalCard(local, lista, '');
    });
    if(html.trim() === ''){
      container.innerHTML = '<div class="empty">Nenhuma viatura encontrada.</div>';
      return;
    }
    container.innerHTML = html;
    bindActions();
  }catch(e){ console.error('renderLocalGrid:', e); }
}

// ==============================================
// BIND DOS BOTÕES DE AÇÃO
// ==============================================
function bindActions(){
  if(!isAdmin()) return;
  document.querySelectorAll('[data-action="mudar"]').forEach(btn => {
    btn.addEventListener('click', () => abrirModalMudarLocal(btn.dataset.prefixo));
  });
  document.querySelectorAll('[data-action="permutar"]').forEach(btn => {
    btn.addEventListener('click', () => abrirModalPermutar(btn.dataset.prefixo, btn.dataset.origem, btn.dataset.gbm));
  });
  document.querySelectorAll('[data-action="baixar"]').forEach(btn => {
    btn.addEventListener('click', () => abrirModalBaixar(btn.dataset.prefixo, btn.dataset.gbm, btn.dataset.origem));
  });
  document.querySelectorAll('[data-action="reativar"]').forEach(btn => {
    btn.addEventListener('click', () => abrirModalReativar(btn.dataset.prefixo));
  });
  document.querySelectorAll('[data-action="moverReserva"]').forEach(btn => {
    btn.addEventListener('click', () => abrirModalMoverReserva(btn.dataset.prefixo));
  });
}

function render(){
  renderSummary();
  renderLocalGrid();
}

// ✅ Busca com debounce para não travar no iOS
let searchDebounce = null;
document.getElementById('search').addEventListener('input', () => {
  clearTimeout(searchDebounce);
  searchDebounce = setTimeout(render, 180);
});

// ==============================================
// MODAL GENÉRICO
// ==============================================
function abrirModal(titulo, camposHtml, onConfirm){
  if(!isAdmin()){ alert('Acesso negado.'); return; }
  document.getElementById('modalTitle').textContent = titulo;
  document.getElementById('modalFields').innerHTML = camposHtml;
  const modal = document.getElementById('actionModal');
  modal.style.display = 'flex';

  const confirm = document.getElementById('modalConfirm');
  const cancel = document.getElementById('modalCancel');

  function fechar(){
    modal.style.display = 'none';
    confirm.removeEventListener('click', handler);
    cancel.removeEventListener('click', fechar);
    confirm.disabled = false;
    confirm.textContent = 'Confirmar';
  }
  async function handler(){
    if(confirm.disabled) return;
    confirm.disabled = true;
    confirm.textContent = 'Processando...';
    try{
      const ok = await onConfirm();
      if(ok) fechar();
      else { confirm.disabled = false; confirm.textContent = 'Confirmar'; }
    }catch(e){
      alert('Erro: ' + e.message);
      confirm.disabled = false;
      confirm.textContent = 'Confirmar';
    }
  }
  confirm.addEventListener('click', handler);
  cancel.addEventListener('click', fechar);
}

function htmlOpcoesLocais(selecionado){
  function opt(l){
    const sel = (selecionado && normalizeStr(l) === normalizeStr(selecionado)) ? ' selected' : '';
    return `<option value="${escapeAttr(l)}"${sel}>${escapeHtml(l)}</option>`;
  }
  let html = '';
  if(LOCAIS.length > 0){
    html += `<optgroup label="GBMs / SGBM / GBS">`;
    html += LOCAIS.map(opt).join('');
    html += `</optgroup>`;
  }
  if(LOCAIS_DEPARTAMENTAIS.length > 0){
    html += `<optgroup label="Departamentos">`;
    html += LOCAIS_DEPARTAMENTAIS.map(opt).join('');
    html += `</optgroup>`;
  }
  return html;
}

function htmlOpcoesMotivo(){
  let html = '';
  MOTIVOS_BAIXA.forEach(m => {
    html += `<option value="${escapeAttr(m)}">${escapeHtml(m)}</option>`;
  });
  return html;
}

function htmlOpcoesSubstituta(prefixoExcluido){
  const outras = VIATURAS.filter(v => v.prefixo !== prefixoExcluido && v.origem !== 'baixada');
  if(outras.length === 0) return `<option value="">— Nenhuma outra viatura disponível —</option>`;
  let html = `<option value="">— Nenhuma (deixar vaga) —</option>`;
  const reservas = outras.filter(v => v.origem === 'reserva');
  const ativas = outras.filter(v => v.origem === 'ativa');
  if(reservas.length){
    html += `<optgroup label="Reservas (serão promovidas)">`;
    reservas.forEach(v => html += `<option value="${escapeAttr(v.prefixo)}">${escapeHtml(v.prefixo)} · DEMAN</option>`);
    html += `</optgroup>`;
  }
  if(ativas.length){
    html += `<optgroup label="Ativas (serão realocadas)">`;
    ativas.forEach(v => html += `<option value="${escapeAttr(v.prefixo)}">${escapeHtml(v.prefixo)} · ${escapeHtml(v.gbm)}</option>`);
    html += `</optgroup>`;
  }
  return html;
}

// ==============================================
// AÇÕES
// ==============================================
function abrirModalMudarLocal(prefixo){
  const v = VIATURAS.find(x => x.prefixo === prefixo);
  if(!v) return;
  abrirModal('Mudar local · ' + prefixo, `
    <label>Local atual
      <input type="text" value="${escapeAttr(v.gbm)}" disabled style="opacity:.6;">
    </label>
    <label>Novo local
      <select id="modalGbm" autofocus>${htmlOpcoesLocais(v.gbm)}</select>
    </label>
  `, async () => {
    const novoGbm = document.getElementById('modalGbm').value;
    if(!novoGbm){ alert('Selecione o local.'); return false; }
    if(normalizeStr(novoGbm) === normalizeStr(v.gbm)){
      alert('O local é o mesmo. Nada a alterar.');
      return false;
    }
    const r = await apiCall('mudarGbm', { prefixo, novoGbm });
    if(!r.ok){ alert('Erro: ' + r.error); return false; }
    await loadData();
    return true;
  });
}

function abrirModalPermutar(prefixo, origem, gbm){
  const destinoAPI = origem === 'ativa' ? 'reservas' : 'ativas';
  const destinoLabel = origem === 'ativa' ? 'DEMAN (Reserva)' : 'Ativa';
  const titulo = origem === 'ativa' ? `Mover ${prefixo} para Reserva` : `Ativar ${prefixo}`;

  let corpo = `<p style="font-size:13px;color:var(--text-dim);margin:0;">
    <b>${escapeHtml(prefixo)}</b> ${gbm ? `· ${escapeHtml(gbm)}` : ''} será movida para <b>${destinoLabel}</b>.
  </p>`;

  if(origem === 'reserva'){
    corpo += `<label>Local de destino
      <select id="modalNovoGbm" autofocus>${htmlOpcoesLocais('')}</select>
    </label>`;
  }

  if(origem === 'ativa' && gbm){
    corpo += `<label>Viatura substituta em ${escapeHtml(gbm)} (opcional)
      <select id="modalSubstituto">${htmlOpcoesSubstituta(prefixo)}</select>
    </label>`;
  }

  abrirModal(titulo, corpo, async () => {
    const sub = document.getElementById('modalSubstituto');
    const substituto = sub ? sub.value : '';
    const gbmSel = document.getElementById('modalNovoGbm');
    const novoGbm = gbmSel ? gbmSel.value : '';
    if(origem === 'reserva' && !novoGbm){
      alert('Selecione o local de destino.');
      return false;
    }
    const r = await apiCall('permutarViatura', { prefixo, destino: destinoAPI, substituto, novoGbm });
    if(!r.ok){ alert('Erro: ' + r.error); return false; }
    await loadData();
    return true;
  });
}

function abrirModalBaixar(prefixo, gbm, origem){
  let corpo = `<p style="font-size:13px;color:var(--text-dim);margin:0;">
    Confirma o baixamento de <b>${escapeHtml(prefixo)}</b>${gbm ? ` (${escapeHtml(gbm)})` : ''}?
  </p>
  <label>Motivo
    <select id="modalMotivo" autofocus>${htmlOpcoesMotivo()}</select>
  </label>`;

  if(origem === 'ativa' && gbm){
    corpo += `<label>Viatura substituta em ${escapeHtml(gbm)} (opcional)
      <select id="modalSubstituto">${htmlOpcoesSubstituta(prefixo)}</select>
    </label>`;
  }

  abrirModal('Baixar viatura · ' + prefixo, corpo, async () => {
    const motivo = document.getElementById('modalMotivo').value;
    if(!motivo){ alert('Selecione o motivo.'); return false; }
    const sub = document.getElementById('modalSubstituto');
    const substituto = sub ? sub.value : '';
    const r = await apiCall('baixarViatura', { prefixo, motivo, substituto });
    if(!r.ok){ alert('Erro: ' + r.error); return false; }
    await loadData();
    return true;
  });
}

function abrirModalReativar(prefixo){
  const v = VIATURAS.find(x => x.prefixo === prefixo);
  if(!v) return;
  abrirModal('Reativar viatura · ' + prefixo, `
    <p style="font-size:13px;color:var(--text-dim);margin:0;">
      <b>${escapeHtml(prefixo)}</b> voltará ao serviço ativo.
    </p>
    ${v.gbm ? `<label>Local original
      <input type="text" value="${escapeAttr(v.gbm)}" disabled style="opacity:.6;">
    </label>` : ''}
    <label>Novo local (pode ser qualquer um)
      <select id="modalGbm" autofocus>${htmlOpcoesLocais(v.gbm)}</select>
    </label>
  `, async () => {
    const gbm = document.getElementById('modalGbm').value;
    if(!gbm){ alert('Selecione o local.'); return false; }
    const r = await apiCall('reativarViatura', { prefixo, gbm });
    if(!r.ok){ alert('Erro: ' + r.error); return false; }
    await loadData();
    return true;
  });
}

function abrirModalMoverReserva(prefixo){
  abrirModal('Mover para Reserva · ' + prefixo, `
    <p style="font-size:13px;color:var(--text-dim);margin:0;">
      <b>${escapeHtml(prefixo)}</b> será movida de <b>baixadas</b> para <b>DEMAN (Reserva)</b>.
    </p>
  `, async () => {
    const r = await apiCall('moverBaixadaParaReserva', { prefixo });
    if(!r.ok){ alert('Erro: ' + r.error); return false; }
    await loadData();
    return true;
  });
}

// ==============================================
// INICIALIZAÇÃO
// ==============================================
function startApp(){
  hideLogin();
  document.getElementById('currentUserName').textContent = USUARIO_ATUAL || '—';
  const perfilEl = document.getElementById('currentUserPerfil');
  if(perfilEl){
    perfilEl.textContent = isAdmin() ? 'ADMIN' : 'VISUALIZAR';
    perfilEl.className = 'badge-perfil ' + (isAdmin() ? 'admin' : 'visualizar');
    perfilEl.style.display = 'inline-block';
  }

  // ✅ Mostra dados do cache IMEDIATAMENTE (se existir)
  if(carregarCache()){
    render();
    const idade = idadeCache();
    if(idade < 60){
      document.getElementById('updateStatus').textContent = 'Dados em cache (' + idade + 's atrás)';
    } else {
      document.getElementById('updateStatus').textContent = 'Atualizando...';
    }
  }

  // Busca dados frescos em paralelo
  loadData();

  // Polling a cada 3 min
  setInterval(loadData, 180000);
}

(function init(){
  if(sessionStorage.getItem('deman_auth') === 'ok'){
    USUARIO_ATUAL = sessionStorage.getItem('deman_user_nome') || '';
    PERFIL_ATUAL = sessionStorage.getItem('deman_user_perfil') || 'visualizar';
    startApp();
  } else {
    showLogin();
  }
})();
</script>
